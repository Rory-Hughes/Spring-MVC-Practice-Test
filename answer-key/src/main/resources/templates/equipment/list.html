<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trail equipment</title>
    <link rel="stylesheet" href="/practice.css" th:href="@{/practice.css}">
</head>
<body>
<main>
    <h1>Trail equipment</h1>
    <table>
        <thead>
        <tr>
            <th scope="col">Asset tag</th>
            <th scope="col">Name</th>
            <th scope="col">Quantity</th>
            <th scope="col">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${equipmentList}">
            <td th:text="${item.assetTag}"></td>
            <td th:text="${item.name}"></td>
            <td th:text="${item.quantity}"></td>
            <td><a th:href="@{/equipment/{id}/edit(id=${item.id})}">Edit</a></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
